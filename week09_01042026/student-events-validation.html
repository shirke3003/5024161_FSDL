<!DOCTYPE html>
<html ng-app="studentApp">
<head>
<title>Student Record - Events and Validation</title>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<style>
body{
    font-family: Arial;
    background: #f5f5f5;
}

.container{
    width: 450px;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 30px;
    box-shadow: 0 0 10px #ccc;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    width:100%;
    cursor:pointer;
}

button:disabled{
    background:gray;
}

table{
    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}

table, th, td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

.error{
    color:red;
    font-size:12px;
}

input.ng-invalid.ng-touched{
    border:2px solid red;
}

input.ng-valid.ng-touched{
    border:2px solid green;
}
</style>

</head>

<body ng-controller="studentController">

<div class="container">

<h2>Student Record</h2>

<form name="studentForm" novalidate>

<label>Name</label>
<input type="text" name="name" ng-model="student.name" required>
<div class="error" 
ng-show="studentForm.name.$touched && studentForm.name.$invalid">
Name is required
</div>

<label>Roll No</label>
<input type="number" name="roll" ng-model="student.roll" required>
<div class="error"
ng-show="studentForm.roll.$touched && studentForm.roll.$invalid">
Valid roll number required
</div>

<label>Marks</label>
<input type="number" name="marks" ng-model="student.marks" min="0" max="100" required>
<div class="error"
ng-show="studentForm.marks.$touched && studentForm.marks.$invalid">
Marks must be between 0 and 100
</div>

<button ng-click="addStudent()" ng-disabled="studentForm.$invalid">
Add Student
</button>

</form>

<table>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Marks</th>
</tr>

<tr ng-repeat="s in students">
<td>{{s.name}}</td>
<td>{{s.roll}}</td>
<td>{{s.marks}}</td>
</tr>
</table>

</div>

<script>
var app = angular.module("studentApp", []);

app.controller("studentController", function($scope){

    $scope.students = [];

    $scope.addStudent = function(){

        if($scope.studentForm.$valid){

            $scope.students.push({
                name: $scope.student.name,
                roll: $scope.student.roll,
                marks: $scope.student.marks
            });

            $scope.student = {};
        }

    };

});
</script>

</body>
</html>
