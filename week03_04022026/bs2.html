<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pretty Bootstrap No JS</title>

    <!-- Bootstrap CSS ONLY -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">MySite</a>
        <ul class="navbar-nav flex-row">
            <li class="nav-item me-4">
                <a class="nav-link text-white active" href="#">Home</a>
            </li>
            <li class="nav-item me-4">
                <a class="nav-link text-white" href="#">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">Contact</a>
            </li>
        </ul>
    </div>
</nav>

<!-- HERO / JUMBOTRON -->
<div class="container my-5">
    <div class="p-5 bg-white rounded-4 shadow">
        <h1 class="fw-bold text-primary">Welcome</h1>
        <p class="text-muted fs-5">
            A clean Bootstrap page using only CSS.
        </p>
        <button class="btn btn-primary btn-lg">Get Started</button>
    </div>
</div>

<!-- BREADCRUMB -->
<div class="container mb-4">
    <nav>
        <ol class="breadcrumb bg-white p-3 rounded shadow-sm">
            <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Home</a></li>
            <li class="breadcrumb-item active">Dashboard</li>
        </ol>
    </nav>
</div>

<!-- GRID SYSTEM -->
<div class="container mb-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="p-4 bg-white rounded shadow text-center">
                <h5 class="text-primary">Column 1</h5>
                <p class="text-muted">Bootstrap Grid</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-4 bg-white rounded shadow text-center">
                <h5 class="text-success">Column 2</h5>
                <p class="text-muted">Responsive Layout</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-4 bg-white rounded shadow text-center">
                <h5 class="text-danger">Column 3</h5>
                <p class="text-muted">Easy Design</p>
            </div>
        </div>
    </div>
</div>

<!-- FORM -->
<div class="container mb-5">
    <div class="bg-white p-4 rounded shadow">
        <h3 class="mb-4 text-primary">Contact Form</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">Subscribe</label>
            </div>

            <button class="btn btn-success">Submit</button>
            <button class="btn btn-outline-secondary">Cancel</button>
        </form>
    </div>
</div>

<!-- BUTTONS -->
<div class="container mb-5 text-center">
    <h3 class="mb-3">Buttons</h3>
    <button class="btn btn-primary me-2">Primary</button>
    <button class="btn btn-success me-2">Success</button>
    <button class="btn btn-warning me-2">Warning</button>
    <button class="btn btn-danger">Danger</button>
</div>

</body>
</html>
