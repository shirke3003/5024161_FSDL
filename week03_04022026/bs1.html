<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap No JS</title>

    <!-- Bootstrap CSS ONLY -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR (NO TOGGLE, NO JS) -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">MySite</a>
        <ul class="navbar-nav flex-row">
            <li class="nav-item me-3">
                <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item me-3">
                <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
            </li>
        </ul>
    </div>
</nav>

<!-- JUMBOTRON (BOOTSTRAP 5 STYLE) -->
<div class="container mt-4">
    <div class="bg-light p-5 rounded">
        <h1>Welcome</h1>
        <p>This is a simple Bootstrap page without JavaScript.</p>
        <button class="btn btn-primary">Read More</button>
    </div>
</div>

<!-- BREADCRUMB -->
<div class="container mt-3">
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item active">Page</li>
        </ol>
    </nav>
</div>

<!-- GRID SYSTEM -->
<div class="container mt-4">
    <div class="row">
        <div class="col-4 bg-secondary text-white p-3">Column 1</div>
        <div class="col-4 bg-warning p-3">Column 2</div>
        <div class="col-4 bg-info text-white p-3">Column 3</div>
    </div>
</div>

<!-- FORM -->
<div class="container mt-4">
    <h3>Form</h3>

    <form>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Accept terms</label>
        </div>

        <button class="btn btn-success">Submit</button>
        <button class="btn btn-danger">Cancel</button>
    </form>
</div>

<!-- BUTTONS -->
<div class="container mt-4 mb-5">
    <h3>Buttons</h3>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-warning">Warning</button>
</div>

</body>
</html>
