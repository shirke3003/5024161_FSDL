<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Culinary School Timetable</title>

    <!-- Bootstrap CSS ONLY -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Culinary School</a>
        <div>
            <a class="nav-link d-inline text-white" href="#">Home</a>
            <a class="nav-link d-inline text-white" href="#">Timetable</a>
            <a class="nav-link d-inline text-white" href="#">Contact</a>
        </div>
    </div>
</nav>

<!-- JUMBOTRON -->
<div class="container my-4">
    <div class="bg-white p-5 rounded shadow">
        <h1 class="fw-bold text-danger">Weekly Timetable</h1>
        <p class="text-muted">
            Professional Culinary Arts – Class Schedule
        </p>
        <button class="btn btn-danger">View Courses</button>
    </div>
</div>

<!-- BREADCRUMB -->
<div class="container mb-4">
    <nav>
        <ol class="breadcrumb bg-white p-3 rounded shadow-sm">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item active">Timetable</li>
        </ol>
    </nav>
</div>

<!-- GRID SYSTEM (TIMETABLE) -->
<div class="container mb-4">
    <div class="row text-center">
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">
                <h5 class="text-danger">Monday</h5>
                <p>Knife Skills<br>Food Safety</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">
                <h5 class="text-danger">Wednesday</h5>
                <p>Baking Basics<br>Pastry Arts</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">
                <h5 class="text-danger">Friday</h5>
                <p>International Cuisine<br>Plating</p>
            </div>
        </div>
    </div>
</div>

<!-- FORM -->
<div class="container mb-4">
    <div class="bg-white p-4 rounded shadow">
        <h4 class="mb-3">Student Registration</h4>

        <form>
            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>

            <button class="btn btn-success">Register</button>
            <button class="btn btn-secondary">Reset</button>
        </form>
    </div>
</div>

<!-- BUTTONS -->
<div class="container text-center mb-5">
    <button class="btn btn-danger me-2">Apply Now</button>
    <button class="btn btn-outline-danger me-2">Download TT</button>
    <button class="btn btn-dark">Back</button>
</div>

</body>
</html>
