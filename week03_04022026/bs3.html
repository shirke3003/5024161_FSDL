<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Components Demo</title>

    <!-- Bootstrap CSS ONLY -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Bootstrap Demo</a>
        <div>
            <a class="nav-link d-inline text-white" href="#">Home</a>
            <a class="nav-link d-inline text-white" href="#">About</a>
            <a class="nav-link d-inline text-white" href="#">Contact</a>
        </div>
    </div>
</nav>

<!-- JUMBOTRON -->
<div class="container my-4">
    <div class="bg-white p-5 rounded shadow">
        <h1 class="fw-bold">Welcome</h1>
        <p class="text-muted">This page demonstrates basic Bootstrap components.</p>
        <button class="btn btn-primary">Learn More</button>
    </div>
</div>

<!-- BREADCRUMB -->
<div class="container mb-4">
    <nav>
        <ol class="breadcrumb bg-white p-3 rounded shadow-sm">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item active">Dashboard</li>
        </ol>
    </nav>
</div>

<!-- GRID SYSTEM -->
<div class="container mb-4">
    <div class="row text-center">
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">Column 1</div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">Column 2</div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow">Column 3</div>
        </div>
    </div>
</div>

<!-- FORM -->
<div class="container mb-4">
    <div class="bg-white p-4 rounded shadow">
        <h4>Student Form</h4>

        <form>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>

            <button class="btn btn-success">Submit</button>
            <button class="btn btn-danger">Cancel</button>
        </form>
    </div>
</div>

<!-- BUTTONS -->
<div class="container text-center mb-5">
    <button class="btn btn-primary me-2">Primary</button>
    <button class="btn btn-secondary me-2">Secondary</button>
    <button class="btn btn-warning">Warning</button>
</div>

</body>
</html>
